name: Create Release & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        shell: pwsh
        run: |
          git clone --depth 1 --branch ${{ github.ref_name }} https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .

      - name: Configure CMake
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          cmake --preset release -DRETOOL_VERSION=$version

      - name: Build retool
        shell: pwsh
        run: |
          cmake --build build/release --config Release

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} build/release/Release/retool.exe --title "${{ github.ref_name }}" --generate-notes